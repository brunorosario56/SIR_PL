version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      # Database name from .env.example (MONGO_URI => classmate_sync)
      MONGO_INITDB_DATABASE: classmate_sync
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - sir-network

volumes:
  mongo-data:

networks:
  sir-network:
    driver: bridge
